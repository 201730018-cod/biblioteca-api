spring.application.name=biblioteca

# ---- Conexion a MySQL ----
# Los valores se leen de variables de entorno.
# Lo que va despues de los dos puntos es el valor por defecto si la variable no existe.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:biblioteca}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- Servidor ----
server.port=${SERVER_PORT:8080}
server.error.include-message=always
spring.jackson.deserialization.fail-on-null-for-primitives=false